resources:
- repo: self

variables:
  # CodeQL is auto-injected into every job by the 1ES policy decorator. Off by
  # default so the python test matrix (5 parallel jobs) does not each build and
  # upload a competing database -- S360 records arg_max(SnapshotDate) per
  # (repo, language). The dedicated 'CodeQL' job below opts back in.
  # See https://aka.ms/codeql3000 and https://aka.ms/sdlfaqcodeql.
  Codeql.Enabled: false

#Multi-configuration and multi-agent job options are not exported to YAML. Configure these options using documentation guidance: https://docs.microsoft.com/vsts/pipelines/process/phases
jobs:

# Owns the 'python' and 'javascript' CodeQL snapshots for this repo
# (Microsoft.Security.CodeQL.10000). Both are interpreted languages, so CodeQL
# extracts them straight from the checked-out sources and no build step is
# needed between Init and Finalize. 'javascript' is graded because of
# sdklab/meantimerecovery/aedes/aedes_server.js.
- job: 'CodeQL'
  displayName: 'CodeQL (python, javascript)'
  variables:
    # Only on main; this pipeline also runs on PRs, which need no snapshot.
    Codeql.Enabled: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
    Codeql.Language: python,javascript
  pool:
    vmImage: 'ubuntu-24.04'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      architecture: 'x64'
  - task: CodeQL3000Init@0
    displayName: 'Initialize CodeQL'
  - task: CodeQL3000Finalize@0
    displayName: 'Finalize CodeQL'
    condition: always()

- job: 'Static_Analysis'
  condition: false # Disabling this job since it is failing on recent runs. Must be re-enabled asap.
  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      architecture: 'x64'
  - task: ComponentGovernanceComponentDetection@0
    inputs:
      scanType: 'Register'
      verbosity: 'Verbose'
      alertWarningLevel: 'High'
  
  - script: 'python scripts/env_setup.py --no_dev'
    displayName: 'Prepare environment (install packages + dependencies + tools)'

  - script: 'flake8 .'
    displayName: 'Flake8'

- job: 'Test'
  pool:
    vmImage: 'ubuntu-24.04'
  strategy:
      matrix:
        Python39:
          python.version: '3.9'
        Python310:
          python.version: '3.10'
        Python311:
          python.version: '3.11'
        Python312:
          python.version: '3.12'
        Python313:
          python.version: '3.13'
        # Disabled as it is failing on pipeline (published uamqp wheel fails to compile)
        # Python314:
        #   python.version: '3.14'
  steps:
  - task: UsePythonVersion@0
    displayName: 'Use Python $(python.version)'
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'

  - script: 'python -m pip install --upgrade pip'
    displayName: 'Update pip'

  - script: 'python scripts/env_setup.py --no_dev'
    displayName: 'Prepare environment (install packages + dependencies + tools)'

  - script: 'pytest tests --junitxml=junit/azure-iot-device-test-results.xml --cov=azure --cov-report=xml:coverage.xml --cov-report=html:coverage --cov-append'
    displayName: pytest

  - task: PublishTestResults@2
    displayName: 'Publish Test Results **/*-test-results.xml'
    inputs:
      testResultsFiles: '**/*-test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: always()

  - task: PublishCodeCoverageResults@2
    inputs:
      summaryFileLocation: '$(Build.SourcesDirectory)/coverage.xml'
      failIfCoverageEmpty: true

- job: 'Publish'
  dependsOn:
  - 'Test'
  - 'Static_Analysis'

  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      architecture: 'x64'

  - script: |
      pip install wheel
      pip install setuptools
      python scripts/build_packages.py
    displayName: Build source and wheel distribution

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact dist'
    inputs:
      pathtoPublish: $(Build.SourcesDirectory)/dist
      artifactName: 'dist'
