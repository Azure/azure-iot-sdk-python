trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

resources:
- repo: self

variables:
  # CodeQL is auto-injected into every job by the 1ES policy decorator. Off by
  # default so other jobs do not build and upload competing databases -- S360
  # records arg_max(SnapshotDate) per (repo, language). The dedicated 'CodeQL'
  # job below opts back in.
  # See https://aka.ms/codeql3000 and https://aka.ms/sdlfaqcodeql.
  Codeql.Enabled: false

#Multi-configuration and multi-agent job options are not exported to YAML. Configure these options using documentation guidance: https://docs.microsoft.com/vsts/pipelines/process/phases
jobs:

# Owns the 'python' and 'javascript' CodeQL snapshots for this repo
# (Microsoft.Security.CodeQL.10000). Both are interpreted languages, so CodeQL
# extracts them straight from the checked-out sources and no build step is
# needed between Init and Finalize. 'javascript' is graded because of
# sdklab/meantimerecovery/aedes/aedes_server.js.
- job: 'CodeQL'
  displayName: 'CodeQL (python, javascript)'
  # Skip the job outright on PRs rather than only disabling the tasks, so PR runs
  # do not pay for an agent, a checkout and a python install for nothing.
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  variables:
    Codeql.Enabled: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
    Codeql.Language: python,javascript
  pool:
    vmImage: 'ubuntu-24.04'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      architecture: 'x64'
  - task: CodeQL3000Init@0
    displayName: 'Initialize CodeQL'
  - task: CodeQL3000Finalize@0
    displayName: 'Finalize CodeQL'
    condition: always()

- job: 'Static_Analysis'
  displayName: 'Component Governance'
  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: ComponentGovernanceComponentDetection@0
    inputs:
      scanType: 'Register'
      verbosity: 'Verbose'
      alertWarningLevel: 'High'

- job: 'Publish'
  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      architecture: 'x64'

  - script: 'python -m pip install uv'
    displayName: 'Install uv'

  # Cache downloads without reusing the job environment.
  - task: Cache@2
    displayName: 'Cache uv'
    inputs:
      key: '"uv" | "$(Agent.OS)" | "build" | uv.lock'
      restoreKeys: |
        "uv" | "$(Agent.OS)" | "build"
        "uv" | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.uv-cache

  - script: 'uv build'
    displayName: Build source and wheel distribution
    env:
      UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact dist'
    inputs:
      pathtoPublish: $(Build.SourcesDirectory)/dist
      artifactName: 'dist'
