resources:
- repo: self
#Multi-configuration and multi-agent job options are not exported to YAML. Configure these options using documentation guidance: https://docs.microsoft.com/vsts/pipelines/process/phases

stages:
- stage: setup
  jobs:
  - job: create_azure_resources
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self
      submodules: false
      fetchDepth: 1
      sparseCheckoutDirectories: testtools/scripts
      displayName: "Checkout (scripts only)"
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'iot hub sdk service connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/Azure/azure-iot-sdk-c/refs/heads/ewertons/pipelinefixes/testtools/scripts/Azure.Iot.Sdk.Test.psm1 -OutFile ./Azure.Iot.Sdk.Test.psm1
          Import-Module ./Azure.Iot.Sdk.Test.psm1

          $ResourceGroupName = New-AzureResourceGroupName -OutFile "test_config/azure-resource-group-name.txt"
          $TestEnvInfo = New-AzIotTestEnvironment -AzureLocation $env:AZURE_LOCATION -ResourceGroup $ResourceGroupName -EnableFileUpload -IotHubX509ThumbprintDevices 1 -DpsX509IndividualEnrollments 1 -EnableCertificateManagement
          New-AzIotPythonSDKE2ETestConfig -TestEnvInfo $TestEnvInfo -Target bash -OutFile test_config/set_e2e_test_env_vars.sh
      displayName: Create Azure Resources and Test Config
    - publish: test_config
      artifact: test_config_scripts
      displayName: Publish artifact (test config scripts)
      condition: always()
- stage: build_and_tests
  jobs:
  - job: 'Test'
    pool:
      vmImage: 'ubuntu-22.04'

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        architecture: 'x64'

    - download: current
      artifact: test_config_scripts
      displayName: Download artifact (test config scripts)

    - script: 'python scripts/env_setup.py --no_dev'
      displayName: 'Prepare environment (install packages + dev dependencies + test dependencies + tools)'

    - script: 'python -m pip install cryptography'
      displayName: 'Install pyca/cryptography for X509 functionality'

    - script: |
        cd $(Agent.WorkFolder)
        cd ..
        touch .rnd
      displayName: 'create RANDFILE file (needed to store seed data) separately due to openssl version issues in the pipeline'

    - script: |
        set -e
        source "$(Pipeline.Workspace)/test_config_scripts/set_e2e_test_env_vars.sh"
        cd $(Build.SourcesDirectory)/tests/e2e/provisioning_e2e
        pytest --junitxml=junit/dps-e2e-test-results.xml
      displayName: 'Run Specified E2E Test with env variables'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFiles: '**/dps-e2e-test-*.xml'
        testRunTitle: 'Publish test results for Python $(python.version)'
- stage: cleanup
  dependsOn:
  - setup
  - build_and_tests
  condition: always() # Run stage even if the pipeline run is cancelled.
  jobs:
  - job: destroy_azure_resource_group
    condition: always() # Run job even if the pipeline run is cancelled.
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - checkout: none
    - download: current
      artifact: test_config_scripts
      displayName: Download artifact (test config scripts)
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'iot hub sdk service connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          export AZURE_RESOURCE_GROUP=$(cat "$(Pipeline.Workspace)/test_config_scripts/azure-resource-group-name.txt")
          az group delete --name $AZURE_RESOURCE_GROUP --yes --no-wait
      displayName: Destroy Azure Resource Group
      condition: always() # Run step even if the pipeline run is cancelled.