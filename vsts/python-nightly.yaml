trigger: none

name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName) 

stages:
- stage: setup
  jobs:
  - job: create_iot_hub_and_dps
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - checkout: none
    - script: |
        RESOURCE_SUFFIX=$(tr -d '-' < /proc/sys/kernel/random/uuid)
        AZURE_RESOURCE_GROUP="aziotsdkpython$RESOURCE_SUFFIX"
        AZURE_IOTHUB_NAME="aziotsdkpython$RESOURCE_SUFFIX"

        # Export variables to other stages/jobs/steps.
        echo "##vso[task.setvariable variable=AZURE_RESOURCE_GROUP;isOutput=true]$AZURE_RESOURCE_GROUP"
        echo "##vso[task.setvariable variable=AZURE_IOTHUB_NAME;isOutput=true]$AZURE_IOTHUB_NAME"
      name: setResourceNames
      displayName: Set Azure Resource Names
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'iot hub sdk service connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          export AZURE_RESOURCE_GROUP=$(setResourceNames.AZURE_RESOURCE_GROUP)
          export AZURE_IOTHUB_NAME=$(setResourceNames.AZURE_IOTHUB_NAME)

          az group create -g $AZURE_RESOURCE_GROUP -l $(AZURE_REGION)

          time az iot hub create -g $AZURE_RESOURCE_GROUP -n $AZURE_IOTHUB_NAME --dla false --mintls 1.2 --partition-count 4 --sku S1

          export IOTHUB_CONNECTION_STRING=$(az iot hub connection-string show -g $AZURE_RESOURCE_GROUP --hub-name $AZURE_IOTHUB_NAME --pn iothubowner --query "connectionString" --output tsv)
          export EVENTHUB_CONNECTION_STRING=$(az iot hub connection-string show -g $AZURE_RESOURCE_GROUP --hub-name $AZURE_IOTHUB_NAME --eh --query "connectionString" --output tsv)

          # Limit Azure API concurrency while creating independent groups faster.
          wait_for_consumer_groups() {
              local failed=0
              for pid in "$@"; do
                  wait "$pid" || failed=1
              done
              return "$failed"
          }

          consumer_group_pids=()
          for i in $(seq 1 11); do
              cg_name="cg$i"
              az iot hub consumer-group create -g "$AZURE_RESOURCE_GROUP" --hub-name "$AZURE_IOTHUB_NAME" --name "$cg_name" &
              consumer_group_pids+=("$!")
              if (( ${#consumer_group_pids[@]} == 4 )); then
                  wait_for_consumer_groups "${consumer_group_pids[@]}"
                  consumer_group_pids=()
              fi
          done
          wait_for_consumer_groups "${consumer_group_pids[@]}"

          # Route twin change events to the built-in Event Hubs-compatible endpoint
          # so reported-properties E2E tests can observe service-side patch arrivals.
          az iot hub route create \
            -g "$AZURE_RESOURCE_GROUP" \
            --hub-name "$AZURE_IOTHUB_NAME" \
            --route-name "twin-change-events" \
            --endpoint-name "events" \
            --source-type "twinchangeevents"

          az iot hub route show \
            -g "$AZURE_RESOURCE_GROUP" \
            --hub-name "$AZURE_IOTHUB_NAME" \
            --route-name "twin-change-events"

          # Export variables to other stages/jobs/steps.
          echo "##vso[task.setvariable variable=IOTHUB_CONNECTION_STRING;isOutput=true;isSecret=true]$IOTHUB_CONNECTION_STRING"
          echo "##vso[task.setvariable variable=EVENTHUB_CONNECTION_STRING;isOutput=true;isSecret=true]$EVENTHUB_CONNECTION_STRING"
      displayName: Create IoT Hub & DPS
      name: createAzureResources
- stage: build_and_tests
  jobs:
  - job: 'Test'
    # The Windows legs of this matrix run right up against Azure Pipelines' implicit
    # 60-minute job timeout, so they get cancelled mid-run even though the suite
    # itself passes. Historical Python 3.9 measurements from build 161689:
    #   Windows MQTT leg       60.4 min -> CANCELLED (pytest had already reported
    #                                      "74 passed, 33 skipped" in 57:16)
    #   Windows MQTTWS leg     52.9 min -> passed, with only ~7 minutes of headroom
    #   the seven linux legs  31.9 - 34.7 min
    # Whichever Windows leg is slower on the day is the one that dies, which is why
    # the failure appears to wander between the Windows MQTT and MQTTWS legs.
    # Give the job a realistic budget instead.
    timeoutInMinutes: 90
    variables:
      IOTHUB_CONNECTION_STRING: $[stageDependencies.setup.create_iot_hub_and_dps.outputs['createAzureResources.IOTHUB_CONNECTION_STRING']]
      EVENTHUB_CONNECTION_STRING: $[stageDependencies.setup.create_iot_hub_and_dps.outputs['createAzureResources.EVENTHUB_CONNECTION_STRING']]
    strategy:
      # Each leg has an isolated consumer group, so all legs can run together.
      maxParallel: 11
      matrix:
        py310_windows_mqtt:
          pv: '3.10'
          transport: 'mqtt'
          imageName: 'windows-latest'
          consumerGroup: 'cg1'
        py310_windows_mqttws:
          pv: '3.10'
          transport: 'mqttws'
          imageName: 'windows-latest'
          consumerGroup: 'cg2'
        py310_linux_mqttws:
          pv: '3.10'
          transport: 'mqttws'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg3'
        py310_linux_mqtt:
          pv: '3.10'
          transport: 'mqtt'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg4'
        py311_linux_mqtt:
          pv: '3.11'
          transport: 'mqtt'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg5'
        py312_linux_mqtt:
          pv: '3.12'
          transport: 'mqtt'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg6'
        py312_linux_mqttws:
          pv: '3.12'
          transport: 'mqttws'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg7'
        py313_linux_mqtt:
          pv: '3.13'
          transport: 'mqtt'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg8'
        py313_linux_mqttws:
          pv: '3.13'
          transport: 'mqttws'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg9'
        py314_linux_mqtt:
          pv: '3.14'
          transport: 'mqtt'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg10'
        py314_linux_mqttws:
          pv: '3.14'
          transport: 'mqttws'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg11'


    pool:
      vmImage: $(imageName)

    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pv)
          architecture: 'x64'
          addToPath: true
      # Cache downloads without reusing the job environment.
      - task: Cache@2
        displayName: 'Cache uv'
        inputs:
          key: '"uv" | "$(Agent.OS)" | "$(pv)" | uv.lock'
          restoreKeys: |
            "uv" | "$(Agent.OS)" | "$(pv)"
            "uv" | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.uv-cache
      - script: 'python -m pip install uv'
        displayName: 'Install uv'

      - script: 'uv sync --upgrade --python "$(pv)" --no-dev --group test --group e2e'
        displayName: 'Sync E2E environment'
        env:
          UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

      - script: |
          cd $(Build.SourcesDirectory)/tests/e2e/iothub_e2e
          echo "Using consumer group: ${IOTHUB_E2E_EVENTHUB_CONSUMER_GROUP}"
          # "not x" means "include all tests that don't have the tag named 'x'", which is everything.
          uv run --no-sync pytest --transport=$(transport) --junitxml=junit/TEST-python-e2e.xml -o junit_suite_name="$(Agent.JobName)" -m "not x"
        displayName: 'E2E Device Client MQTT Connection String'
        env:
          IOTHUB_E2E_IOTHUB_CONNECTION_STRING: $(IOTHUB_CONNECTION_STRING)
          IOTHUB_E2E_EVENTHUB_CONNECTION_STRING: $(EVENTHUB_CONNECTION_STRING)
          IOTHUB_E2E_EVENTHUB_CONSUMER_GROUP: $(consumerGroup)
          PYTHONUNBUFFERED: True

      - task: PublishTestResults@2
        displayName: 'Publish Test Results'

        condition: always()
- stage: cleanup
  dependsOn:
  - setup
  - build_and_tests
  condition: always() # Run stage even if the pipeline run is cancelled.
  jobs:
  - job: destroy_azure_resource_group
    condition: always() # Run job even if the pipeline run is cancelled.
    variables:
        AZURE_RESOURCE_GROUP: $[stageDependencies.setup.create_iot_hub_and_dps.outputs['setResourceNames.AZURE_RESOURCE_GROUP']]
    steps:
    - checkout: none
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'iot hub sdk service connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # set -e

          time az group delete --name $(AZURE_RESOURCE_GROUP) --yes
      displayName: Destroy Azure Resource Group
      condition: always() # Run step even if the pipeline run is cancelled.