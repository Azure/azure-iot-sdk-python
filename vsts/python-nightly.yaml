name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName) 

stages:
- stage: Create Azure Resources
  jobs:
  - job: Create IoT Hub & DPS
    steps:
    - script: |
        sudo apt-get install -y uuid

        azure_region="westus2"
        resource_group="aziotsdkpython$(date +%Y%m%d%H%M%S)$(hostname)"
        iothub_name="aziotsdkpython$(uuid)"

        az login --identity
        az group create -g $resource_group -l $azure_region

        az iot hub create -g $resource_group -n $iothub_name --dla false --mintls 1.2 --partition-count 4 --sku S1

        IOTHUB_CONNECTION_STRING=$(az iot hub connection-string show -g $resource_group --hub-name $iothub_name --pn iothubowner --query "connectionString" --output tsv)

        EVENTHUB_CONNECTION_STRING=$(az iot hub connection-string show -g $resource_group --hub-name $iothub_name --eh --query "connectionString" --output tsv)

        az iot hub consumer-group create -g $resource_group --hub-name $iothub_name --name cg9

        az iot hub delete -g $resource_group --name $iothub_name
      displayName: Create IoT Hub & DPS
- stage: Build & Tests
  jobs:
  - job: 'Test'

    strategy:
      maxParallel: 4
      matrix:
        py39_windows_mqtt:
          pv: '3.9'
          transport: 'mqtt'
          imageName: 'windows-latest'
          consumerGroup: 'cg1'
        py39_windows_mqttws:
          pv: '3.9'
          transport: 'mqttws'
          imageName: 'windows-latest'
          consumerGroup: 'cg2'
        py38_linux_mqttws:
          pv: '3.8'
          transport: 'mqttws'
          imageName: 'Ubuntu 20.04'
          consumerGroup: 'cg4'
        py38_linux_mqtt:
          pv: '3.8'
          transport: 'mqtt'
          imageName: 'Ubuntu 20.04'
          consumerGroup: 'cg5'
        py39_linux_mqttws:
          pv: '3.9'
          transport: 'mqttws'
          imageName: 'Ubuntu 20.04'
          consumerGroup: 'cg6'
        py310_linux_mqtt:
          pv: '3.10'
          transport: 'mqtt'
          imageName: 'Ubuntu 20.04'
          consumerGroup: 'cg7'
        py311_linux_mqtt:
          pv: '3.11'
          transport: 'mqtt'
          imageName: 'Ubuntu 20.04'
          consumerGroup: 'cg8'
        py312_linux_mqtt:
          pv: '3.12'
          transport: 'mqtt'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg9'
        py312_linux_mqttws:
          pv: '3.12'
          transport: 'mqttws'
          imageName: 'ubuntu-22.04'
          consumerGroup: 'cg10'


    pool:
      vmImage: $(imageName)

    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pv)
          architecture: 'x64'
          addToPath: true
      - script: 'python scripts/env_setup.py --no_dev'
        displayName: 'Prepare environment (install packages + dev dependencies + test dependencies + tools)'

      - script: |
          cd $(Build.SourcesDirectory)/tests/e2e/iothub_e2e
          echo "Using consumer group: ${IOTHUB_E2E_EVENTHUB_CONSUMER_GROUP}"
          # "not x" means "include all tests that don't have the tag named 'x'", which is everything.
          pytest --transport=$(transport) --junitxml=junit/TEST-python-e2e.xml -o junit_suite_name="$(Agent.JobName)" -m "not x"
        displayName: 'E2E Device Client MQTT Connection String'
        env:
          IOTHUB_E2E_IOTHUB_CONNECTION_STRING: $(IOTHUB-E2E-CONNECTION-STRING)
          IOTHUB_E2E_EVENTHUB_CONNECTION_STRING: $(IOTHUB-E2E-EVENTHUB-CONNECTION-STRING)
          IOTHUB_E2E_EVENTHUB_CONSUMER_GROUP: $(consumerGroup)
          PYTHONUNBUFFERED: True

      - task: PublishTestResults@2
        displayName: 'Publish Test Results'

        condition: always()
- stage: Destroy Azure Resources
