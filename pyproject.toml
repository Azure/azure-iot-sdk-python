[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iot-device"
version = "2.15.0rc1"
description = "Microsoft Azure IoT Device Library"
readme = "README.md"
requires-python = ">=3.10, <4"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Microsoft Corporation", email = "opensource@microsoft.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "deprecation>=2.1.0,<3.0.0",
    "janus",
    "paho-mqtt>=2.0.0,<3.0.0",
    "PySocks",
    "requests>=2.32.3,<3.0.0",
    "requests-unixsocket>=0.4.1",
    "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/Azure/azure-iot-sdk-python/"
Repository = "https://github.com/Azure/azure-iot-sdk-python/"

[dependency-groups]
test = [
    "dev-utils",
    "pytest>=9.0.3",
    "pytest-asyncio~=1.2",
    "pytest-cov",
    "pytest-mock",
    "pytest-testdox>=1.1.1",
    "pytest-timeout",
    "urllib3<3.0.0", # Needed for mocking the requests stack
]
e2e = [
    "azure-eventhub", # Only needed for iothub e2e
    # Use a GitHub dependency to get the beta version of azure-iot-hub
    "azure-iot-hub @ git+https://github.com/Azure/azure-iot-hub-python.git@52d1ee2b5b987ae24dd3f9891ca55177c19aeb3c", # Only needed for iothub e2e
    "azure-iothub-provisioningserviceclient>=1.2.0", # Only needed for provisioning e2e
    "cryptography", # Needed for X509 functionality in provisioning e2e
    "psutil", # Only needed for iothub e2e
    "six", # Needed due to a missing dependency in azure-iot-hub
]
lint = [
    "black>=25.1.0",
    "ruff>=0.12.0",
]
dev = [
    { include-group = "test" },
    { include-group = "e2e" },
    { include-group = "lint" },
    "build>=1.2.2",
    "pre-commit>=4.0.0",
    "twine>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["azure-iot-device"]
include = ["azure*"]
namespaces = true

[tool.setuptools.package-data]
"azure.iot.device" = ["py.typed"]

[tool.uv.sources]
dev-utils = { path = "dev_utils", editable = true }

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
        \.git
    | \.venv
    | tests/e2e/provisioning_e2e/iothubservice20180630
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testdox_format = "plaintext"
addopts = "--testdox --timeout 20 --ignore e2e --ignore tests/e2e"
norecursedirs = ["__pycache__", "*.egg-info"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/e2e/provisioning_e2e/iothubservice20180630"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]